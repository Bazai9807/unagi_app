plugins { id 'com.android.application' }

android {
    namespace 'ru.unagi.mobile'
    compileSdk 36
    buildFeatures { buildConfig true }
    // Both Android and the future iOS shell consume shared/www without a second copy.
    sourceSets {
        main.assets.srcDirs = [rootProject.file('shared')]
    }
    defaultConfig {
        applicationId 'ru.unagi.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-demo'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
